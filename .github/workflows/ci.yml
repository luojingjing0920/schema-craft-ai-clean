name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The job only reads the repository; nothing here needs write access.
permissions:
  contents: read

jobs:
  quality-gates:
    name: Test, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Must match vitest's engines (`^22.12.0 || ^24.0.0 || >=26.0.0`); Node 20 is not supported.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npx tsc -b

      - name: Build
        run: npm run build
